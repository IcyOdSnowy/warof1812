<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | 1812 Digital Archive</title>
    <!-- Modern Font: Inter for UI, Playfair for History -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF; /* Tech Blue */
            --bg: #ffffff;
            --card: #f5f5f7;
            --text: #1d1d1f;
            --success: #27ae60;
            --error: #ff3b30;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 5%; background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        header {
            padding: 60px 5% 40px;
            background: var(--card);
            text-align: center;
        }

        header h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin: 0; }
        header p { font-size: 1.1rem; opacity: 0.7; margin-top: 10px; }

        /* Quiz Container */
        .quiz-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 5%;
        }

        #quiz-container {
            background: var(--card);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            border-radius: 28px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .question {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: var(--text);
            line-height: 1.3;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button.option {
            padding: 18px 25px;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 16px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.2, 1, 0.2, 1);
            color: var(--text);
        }

        button.option:hover {
            border-color: var(--primary);
            background: #f0f7ff;
            transform: translateX(5px);
        }

        /* Result States */
        .correct { 
            background-color: var(--success) !important; 
            color: white !important; 
            border-color: var(--success) !important; 
        }
        .wrong { 
            background-color: var(--error) !important; 
            color: white !important; 
            border-color: var(--error) !important; 
        }
        
        #controls { 
            margin-top: 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 25px;
        }

        #score-box { 
            font-weight: 700; 
            color: var(--primary); 
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #next-btn {
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            transition: opacity 0.2s;
        }

        #next-btn:hover { opacity: 0.9; }

        .badge { 
            background: var(--primary); color: white; padding: 6px 12px; 
            border-radius: 20px; font-size: 11px; font-weight: 800; 
            margin-bottom: 15px; text-transform: uppercase; display: inline-block;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.5rem; }
            #quiz-container { padding: 25px; }
            .question { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<nav>
    <div style="font-weight: 900; font-size: 1.4rem;">HISTORY<span style="color:var(--primary)">1812</span></div>
    <a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: bold; font-size: 0.9rem;">← EXIT QUIZ</a>
</nav>

<header>
    <span class="badge">Interactive Module</span>
    <h1>Knowledge Challenge.</h1>
    <p>Prove your expertise on the conflict that shaped North America.</p>
</header>

<div class="quiz-wrapper">
    <div id="quiz-container">
        <div id="question-text" class="question">Preparing your questions...</div>
        <div id="options-container" class="options"></div>
        
        <div id="controls">
            <div id="score-box">Question 1 of 10</div>
            <button id="next-btn" onclick="loadNextQuestion()">Next Question</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        { q: "What was the British practice of kidnapping American sailors called?", a: ["Jingoism", "Blockading", "Impressment", "Expansionism"], correct: 2 },
        { q: "Who was known as the 'Hero of Upper Canada'?", a: ["John By", "Isaac Brock", "Tecumseh", "James Madison"], correct: 1 },
        { q: "Which Shawnee leader allied with the British?", a: ["Tecumseh", "Pontiac", "Geromino", "Joseph Brant"], correct: 0 },
        { q: "What did Laura Secord do to warn the British?", a: ["Sent a telegram", "Lit a signal fire", "Walked 32km", "Rowed across a lake"], correct: 2 },
        { q: "In which city was the peace treaty signed?", a: ["London", "Washington", "Paris", "Ghent"], correct: 3 },
        { q: "What is 'Jingoism'?", a: ["Peaceful trade", "Aggressive patriotism", "A type of ship", "A battle tactic"], correct: 1 },
        { q: "Which landmark did John By build for defense?", a: ["The White House", "Fort York", "The Rideau Canal", "Parliament Hill"], correct: 2 },
        { q: "What does 'Status quo ante bellum' mean?", a: ["Winner takes all", "The war continues", "The same as before the war", "A new border is drawn"], correct: 2 },
        { q: "True or False: The U.S. gained significant land in the treaty.", a: ["True", "False"], correct: 1 },
        { q: "Which group was largely ignored in the Treaty of Ghent?", a: ["The British", "The Americans", "First Nations", "The French"], correct: 2 }
    ];

    let currentIdx = 0;
    let score = 0;

    function displayQuestion() {
        const data = quizData[currentIdx];
        document.getElementById("question-text").innerText = data.q;
        document.getElementById("score-box").innerText = `Question ${currentIdx + 1} of ${quizData.length}`;
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        
        data.a.forEach((option, i) => {
            const btn = document.createElement("button");
            btn.className = "option";
            btn.innerText = option;
            btn.onclick = () => checkAnswer(i, btn);
            container.appendChild(btn);
        });
        document.getElementById("next-btn").style.display = "none";
    }

    function checkAnswer(selected, btn) {
        const correctIdx = quizData[currentIdx].correct;
        const allBtns = document.querySelectorAll(".option");
        
        allBtns.forEach(b => b.disabled = true); 

        if (selected === correctIdx) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            allBtns[correctIdx].classList.add("correct");
        }
        document.getElementById("next-btn").style.display = "block";
    }

    function loadNextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            displayQuestion();
        } else {
            const container = document.getElementById("quiz-container");
            const percentage = (score / quizData.length) * 100;
            
            // Custom messages based on performance
            let feedbackMessage = percentage >= 70 ? "Great Job!" : "You can do better!";
            
            container.innerHTML = `
                <h2 style="font-family: 'Playfair Display'; font-size: 2.5rem; margin-bottom: 10px;">Archive Complete.</h2>
                <p style="font-size: 1.5rem; color: var(--primary); font-weight: 700; margin-bottom: 30px;">${feedbackMessage}</p>
                <div style="background: white; padding: 30px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.05); margin-bottom: 30px;">
                    <p style="font-size: 3rem; font-weight: 900; color: var(--text); margin: 0;">${score}/${quizData.length}</p>
                    <p style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; margin-top: 10px;">Final Score</p>
                </div>
                <button onclick="location.reload()" style="padding: 15px 40px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%;">Restart Challenge</button>
            `;
        }
    }

    displayQuestion();
</script>

</body>
<script>
    // Disable right-click menu (context menu)
   document.addEventListener('contextmenu', event => event.preventDefault());
   
   // Detect if Developer Tools are opened using shortcuts or console methods
   let devToolsOpened = false;
   const element = new Image();
   Object.defineProperty(element, 'id', {
       get: function() {
           devToolsOpened = true;
           closeGame(); // Close the game if Developer Tools are opened
       }
   });
   
   // Function to check for Developer Tools every second
   setInterval(() => {
       devToolsOpened = false;
       console.log(element); // This triggers the get function if Dev Tools are open
       if (devToolsOpened) {
           closeGame();
       }
   }, 1000);
   
   // Function to close the game or tab
   function closeGame() {
       alert("Sorry! But it doesn't look like you have permission to view the code. If you think this is a mistake, please contact the creators of this project.");
       window.close(); // Close the tab (might be blocked in some browsers)
       window.location.href = "table_of_contents.html"; // Fallback to redirect to a blank page
   }
   
   // Block certain key combinations (Ctrl+Shift+I, Ctrl+U, F12, etc.)
   document.addEventListener('keydown', (event) => {
       if (
           (event.ctrlKey && event.shiftKey && event.keyCode === 73) || // Ctrl+Shift+I
           (event.ctrlKey && event.keyCode === 85) || // Ctrl+U
           (event.keyCode === 123) || // F12
           (event.ctrlKey && event.shiftKey && event.keyCode === 74) // Ctrl+Shift+J (for Console)
       ) {
           event.preventDefault(); // Prevent the default action of opening Dev Tools or View Source
           closeGame();
       }
   });
   
   
   </script>
</html>
